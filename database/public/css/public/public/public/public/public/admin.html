<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Admin Dashboard - VideoHub</title> <link rel="stylesheet" href="/css/style.css"> <style> .admin-page { max-width: 1300px; margin: 0 auto; padding: 35px 20px 60px; } .admin-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 30px; } .admin-header h1 { margin: 0 0 7px; font-size: 32px; } .admin-header p { margin: 0; color: var(--muted); } .logout-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 11px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; } .logout-btn:hover { border-color: #ff7675; color: #ff7675; } .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; } .stat-card { padding: 22px; border-radius: 18px; background: var(--card); border: 1px solid var(--border); } .stat-icon { font-size: 27px; margin-bottom: 12px; } .stat-label { color: var(--muted); font-size: 14px; margin-bottom: 7px; } .stat-value { font-size: 28px; font-weight: 800; } .dashboard-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-bottom: 25px; } .panel { background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; } .panel-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 15px; } .panel-header h2 { margin: 0; font-size: 20px; } .refresh-btn { border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 8px 12px; border-radius: 9px; cursor: pointer; } .table-wrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; min-width: 650px; } th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; } th { color: var(--muted); font-size: 13px; font-weight: 700; } td { font-size: 14px; } tr:last-child td { border-bottom: 0; } .video-name { max-width: 260px; overflow: hidden; text-overflow: ellipsis; } .status { display: inline-flex; padding: 5px 9px; border-radius: 20px; font-size: 12px; font-weight: 700; } .status-ready { background: rgba(85,239,196,.12); color: #55efc4; } .status-pending { background: rgba(253,203,110,.12); color: #fdcb6e; } .status-error { background: rgba(255,118,117,.12); color: #ff7675; } .delete-btn { border: 0; background: rgba(255,118,117,.1); color: #ff7675; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-weight: 700; } .delete-btn:hover { background: rgba(255,118,117,.18); } .empty { padding: 35px; text-align: center; color: var(--muted); } .loading { padding: 35px; text-align: center; color: var(--muted); } .admin-message { display: none; padding: 14px 16px; border-radius: 12px; margin-bottom: 20px; } .admin-message.error { display: block; color: #ff7675; background: rgba(255,118,117,.1); border: 1px solid rgba(255,118,117,.2); } .admin-message.success { display: block; color: #55efc4; background: rgba(85,239,196,.1); border: 1px solid rgba(85,239,196,.2); } .revenue-value { color: #55efc4; font-weight: 800; } .admin-login { max-width: 430px; margin: 80px auto; padding: 30px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; } .admin-login h1 { margin-bottom: 8px; } .admin-login p { color: var(--muted); margin-bottom: 25px; } .form-group { margin-bottom: 18px; } .form-group label { display: block; margin-bottom: 8px; font-weight: 700; } .form-group input { width: 100%; box-sizing: border-box; padding: 14px; border-radius: 11px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; } .admin-login-btn { width: 100%; padding: 14px; border: 0; border-radius: 11px; background: linear-gradient(135deg,#6c5ce7,#00cec9); color: white; font-weight: 800; cursor: pointer; } @media (max-width: 950px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .dashboard-grid { grid-template-columns: 1fr; } } @media (max-width: 600px) { .admin-page { padding: 25px 12px 45px; } .admin-header { align-items: flex-start; flex-direction: column; } .stats-grid { grid-template-columns: 1fr; } .stat-value { font-size: 25px; } } </style> </head> <body> <header class="site-header"> <div class="container nav-container"> <a href="/" class="logo"> <span class="logo-icon">▶</span> <span>VideoHub</span> </a> <nav class="nav-links"> <a href="/">Home</a> <a href="/upload.html">Upload</a> </nav> </div> </header> <main class="admin-page"> <div id="adminMessage" class="admin-message"></div> <section id="loginSection" class="admin-login"> <h1>Admin Login</h1> <p> Sign in to manage your VideoHub platform. </p> <form id="adminLoginForm"> <div class="form-group"> <label for="adminPassword"> Admin Password </label> <input type="password" id="adminPassword" placeholder="Enter admin password" required > </div> <button type="submit" class="admin-login-btn" id="adminLoginBtn" > Login to Dashboard </button> </form> </section> <section id="dashboardSection" style="display:none;"> <div class="admin-header"> <div> <h1>Admin Dashboard</h1> <p> Manage your VideoHub platform. </p> </div> <button class="logout-btn" id="logoutBtn" > Logout </button> </div> <div class="stats-grid"> <div class="stat-card"> <div class="stat-icon"> 🎬 </div> <div class="stat-label"> Total Videos </div> <div class="stat-value" id="totalVideos" > 0 </div> </div> <div class="stat-card"> <div class="stat-icon"> 👥 </div> <div class="stat-label"> Total Users </div> <div class="stat-value" id="totalUsers" > 0 </div> </div> <div class="stat-card"> <div class="stat-icon"> 👁 </div> <div class="stat-label"> Total Views </div> <div class="stat-value" id="totalViews" > 0 </div> </div> <div class="stat-card"> <div class="stat-icon"> 💰 </div> <div class="stat-label"> Revenue </div> <div class="stat-value" id="totalRevenue" > $0.00 </div> </div> </div> <div class="dashboard-grid"> <section class="panel"> <div class="panel-header"> <h2> Recent Videos </h2> <button class="refresh-btn" onclick="loadVideos()" > ↻ Refresh </button> </div> <div id="videosContainer" class="table-wrap" > <div class="loading"> Loading videos... </div> </div> </section> <section class="panel"> <div class="panel-header"> <h2> Recent Users </h2> <button class="refresh-btn" onclick="loadUsers()" > ↻ Refresh </button> </div> <div id="usersContainer" class="table-wrap" > <div class="loading"> Loading users... </div> </div> </section> </div> <section class="panel"> <div class="panel-header"> <h2> Revenue </h2> <button class="refresh-btn" onclick="loadRevenue()" > ↻ Refresh </button> </div> <div id="revenueContainer" class="table-wrap" > <div class="loading"> Loading revenue... </div> </div> </section> </section> </main> <script> let adminToken = localStorage.getItem("videohub_admin_token"); const loginSection = document.getElementById("loginSection"); const dashboardSection = document.getElementById("dashboardSection"); const adminMessage = document.getElementById("adminMessage"); function showMessage(text, type) { adminMessage.textContent = text; adminMessage.className = "admin-message " + type; } function hideMessage() { adminMessage.textContent = ""; adminMessage.className = "admin-message"; } function formatNumber(value) { return Number(value || 0) .toLocaleString(); } function formatMoney(value) { return "$" + Number(value || 0) .toFixed(2); } function formatDate(value) { if (!value) { return "—"; } try { return new Date(value) .toLocaleDateString(); } catch { return "—"; } } function escapeHtml(value) { const div = document.createElement("div"); div.textContent = value ?? ""; return div.innerHTML; } function showDashboard() { loginSection.style.display = "none"; dashboardSection.style.display = "block"; loadDashboard(); } function showLogin() { loginSection.style.display = "block"; dashboardSection.style.display = "none"; } async function adminLogin(password) { const response = await fetch( "/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: password }) } ); const data = await response.json(); if (!response.ok) { throw new Error( data.message || data.error || "Admin login failed." ); } if (!data.token) { throw new Error( "Admin token was not returned." ); } adminToken = data.token; localStorage.setItem( "videohub_admin_token", adminToken ); showDashboard(); } document .getElementById("adminLoginForm") .addEventListener( "submit", async function(event) { event.preventDefault(); hideMessage(); const password = document .getElementById( "adminPassword" ) .value; const button = document .getElementById( "adminLoginBtn" ); button.disabled = true; button.textContent = "Signing in..."; try { await adminLogin( password ); } catch (error) { showMessage( error.message || "Login failed.", "error" ); } finally { button.disabled = false; button.textContent = "Login to Dashboard"; } } ); document .getElementById("logoutBtn") .addEventListener( "click", function() { localStorage.removeItem( "videohub_admin_token" ); adminToken = null; showLogin(); } ); async function adminFetch(url, options = {}) { options.headers = { ...(options.headers || {}), "Authorization": "Bearer " + adminToken }; const response = await fetch( url, options ); if ( response.status === 401 || response.status === 403 ) { localStorage.removeItem( "videohub_admin_token" ); adminToken = null; showLogin(); throw new Error( "Admin session expired." ); } return response; } async function loadDashboard() { hideMessage(); await Promise.all([ loadStats(), loadVideos(), loadUsers(), loadRevenue() ]); } async function loadStats() { try { const response = await adminFetch( "/api/admin/stats" ); const data = await response.json(); if (!response.ok) { throw new Error( data.message || data.error || "Could not load statistics." ); } const stats = data.stats || data; document .getElementById("totalVideos") .textContent = formatNumber( stats.totalVideos ?? stats.videos ?? 0 ); document .getElementById("totalUsers") .textContent = formatNumber( stats.totalUsers ?? stats.users ?? 0 ); document .getElementById("totalViews") .textContent = formatNumber( stats.totalViews ?? stats.views ?? 0 ); document .getElementById("totalRevenue") .textContent = formatMoney( stats.totalRevenue ?? stats.revenue ?? 0 ); } catch (error) { console.error(error); showMessage( error.message, "error" ); } } async function loadVideos() { const container = document.getElementById( "videosContainer" ); container.innerHTML = '<div class="loading">Loading videos...</div>'; try { const response = await adminFetch( "/api/admin/videos" ); const data = await response.json(); if (!response.ok) { throw new Error( data.message || data.error || "Could not load videos." ); } const videos = Array.isArray(data) ? data : ( data.videos || [] ); if (!videos.length) { container.innerHTML = '<div class="empty">No videos found.</div>'; return; } container.innerHTML = ` <table> <thead> <tr> <th>Title</th> <th>Views</th> <th>Likes</th> <th>Downloads</th> <th>Status</th> <th>Action</th> </tr> </thead> <tbody> ${videos.map(video => { const status = video.status || "ready"; const statusClass = status === "ready" ? "status-ready" : status === "pending" ? "status-pending" : "status-error"; return ` <tr> <td class="video-name" title="${escapeHtml(video.title)}" > ${escapeHtml(video.title)} </td> <td> ${formatNumber(video.views)} </td> <td> ${formatNumber(video.likes)} </td> <td> ${formatNumber(video.downloads)} </td> <td> <span class="status ${statusClass}"> ${escapeHtml(status)} </span> </td> <td> <button class="delete-btn" onclick="deleteVideo(${Number(video.id)})" > Delete </button> </td> </tr> `; }).join("")} </tbody> </table> `; } catch (error) { console.error(error); container.innerHTML = '<div class="empty">Unable to load videos.</div>'; showMessage( error.message, "error" ); } } async function deleteVideo(id) { if (!id) { return; } const confirmed = confirm( "Are you sure you want to delete this video?" ); if (!confirmed) { return; } try { const response = await adminFetch( "/api/videos/" + encodeURIComponent(id), { method: "DELETE" } ); const data = await response.json(); if (!response.ok) { throw new Error( data.message || data.error || "Delete failed." ); } showMessage( "Video deleted successfully.", "success" ); await loadVideos(); await loadStats(); } catch (error) { console.error(error); showMessage( error.message || "Unable to delete video.", "error" ); } } async function loadUsers() { const container = document.getElementById( "usersContainer" ); container.innerHTML = '<div class="loading">Loading users...</div>'; try { const response = await adminFetch( "/api/admin/users" ); const data = await response.json(); if (!response.ok) { throw new Error( data.message || data.error || "Could not load users." ); } const users = Array.isArray(data) ? data : ( data.users || [] ); if (!users.length) { container.innerHTML = '<div class="empty">No users found.</div>'; return; } container.innerHTML = ` <table> <thead> <tr> <th>Name</th> <th>Email</th> <th>Role</th> <th>Joined</th> </tr> </thead> <tbody> ${users.map(user => ` <tr> <td> ${escapeHtml( user.name || "User" )} </td> <td> ${escapeHtml( user.email || "" )} </td> <td> ${escapeHtml( user.role || "user" )} </td> <td> ${formatDate( user.created_at )} </td> </tr> `).join("")} </tbody> </table> `; } catch (error) { console.error(error); container.innerHTML = '<div class="empty">Unable to load users.</div>'; showMessage( error.message, "error" ); } } async function loadRevenue() { const container = document.getElementById( "revenueContainer" ); container.innerHTML = '<div class="loading">Loading revenue...</div>'; try { const response = await adminFetch( "/api/admin/revenue" ); const data = await response.json(); if (!response.ok) { throw new Error( data.message || data.error || "Could not load revenue." ); } const revenue = Array.isArray(data) ? data : ( data.revenue || [] ); if (!revenue.length) { container.innerHTML = '<div class="empty">No revenue records yet.</div>'; return; } container.innerHTML = ` <table> <thead> <tr> <th>Video ID</th> <th>Amount</th> <th>Source</th> <th>Status</th> <th>Date</th> </tr> </thead> <tbody> ${revenue.map(item => ` <tr> <td> #${escapeHtml( item.video_id ?? "-" )} </td> <td class="revenue-value"> ${formatMoney( item.amount )} </td> <td> ${escapeHtml( item.source || "ads" )} </td> <td> ${escapeHtml( item.status || "pending" )} </td> <td> ${formatDate( item.created_at )} </td> </tr> `).join("")} </tbody> </table> `; } catch (error) { console.error(error); container.innerHTML = '<div class="empty">Unable to load revenue.</div>'; showMessage( error.message, "error" ); } } if (adminToken) { showDashboard(); } else { showLogin(); } </script> </body> </html>
