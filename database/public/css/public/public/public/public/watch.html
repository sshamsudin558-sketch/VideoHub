<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Watch Video - VideoHub</title> <link rel="stylesheet" href="/css/style.css"> <style> .watch-page { max-width: 1200px; margin: 0 auto; padding: 30px 20px 60px; } .video-player { width: 100%; background: #000; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35); } .video-player video { width: 100%; display: block; max-height: 680px; background: #000; } .video-info { margin-top: 25px; } .video-title { font-size: 32px; line-height: 1.25; margin-bottom: 12px; } .video-meta { display: flex; flex-wrap: wrap; gap: 18px; color: var(--muted); margin-bottom: 22px; } .video-actions { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 22px; border-bottom: 1px solid var(--border); } .action-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 12px; padding: 11px 17px; cursor: pointer; font-weight: 600; transition: .2s; } .action-btn:hover { border-color: var(--primary); transform: translateY(-1px); } .action-btn.liked { background: rgba(108,92,231,.15); border-color: var(--primary); color: #a29bfe; } .description-box { margin-top: 25px; padding: 22px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); } .description-box h3 { margin-bottom: 12px; } .description { color: var(--muted); line-height: 1.7; white-space: pre-wrap; } .comments-section { margin-top: 35px; } .comments-section h2 { margin-bottom: 18px; } .comment-form { display: flex; gap: 10px; margin-bottom: 25px; } .comment-form input { flex: 1; min-width: 0; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); outline: none; } .comment-form button { border: 0; border-radius: 12px; padding: 0 20px; background: linear-gradient(135deg,#6c5ce7,#00cec9); color: white; font-weight: 700; cursor: pointer; } .comment { padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); background: var(--card); border-radius: 14px; } .comment-author { font-weight: 700; margin-bottom: 6px; } .comment-date { color: var(--muted); font-size: 12px; margin-bottom: 9px; } .comment-text { line-height: 1.6; white-space: pre-wrap; } .login-comment { padding: 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); color: var(--muted); margin-bottom: 22px; } .login-comment a { color: var(--primary); font-weight: 700; text-decoration: none; } .loading { text-align: center; padding: 70px 20px; color: var(--muted); } .error-box { max-width: 600px; margin: 80px auto; padding: 30px; text-align: center; border-radius: 18px; background: var(--card); border: 1px solid var(--border); } .error-box h2 { margin-bottom: 10px; } .error-box p { color: var(--muted); margin-bottom: 20px; } .back-btn { display: inline-block; padding: 12px 18px; border-radius: 10px; background: var(--primary); color: white; text-decoration: none; font-weight: 700; } @media (max-width: 700px) { .watch-page { padding: 20px 12px 40px; } .video-title { font-size: 24px; } .comment-form { flex-direction: column; } .comment-form button { padding: 13px; } .video-player { border-radius: 12px; } } </style> </head> <body> <header class="site-header"> <div class="container nav-container"> <a href="/" class="logo"> <span class="logo-icon">▶</span> <span>VideoHub</span> </a> <nav class="nav-links"> <a href="/">Home</a> <a href="/upload.html">Upload</a> <a href="/login.html" id="loginLink">Login</a> </nav> </div> </header> <main class="watch-page"> <div id="loading" class="loading"> Loading video... </div> <div id="errorBox" class="error-box" style="display:none;"> <h2>Video not found</h2> <p id="errorText"> We could not load this video. </p> <a href="/" class="back-btn"> Back to Home </a> </div> <div id="videoContent" style="display:none;"> <div class="video-player"> <video id="videoPlayer" controls playsinline preload="metadata" > Your browser does not support video playback. </video> </div> <section class="video-info"> <h1 class="video-title" id="videoTitle" > Video Title </h1> <div class="video-meta"> <span id="views"> 👁 0 views </span> <span id="likes"> ❤️ 0 likes </span> <span id="downloads"> ⬇ 0 downloads </span> <span id="date"> 📅 — </span> </div> <div class="video-actions"> <button class="action-btn" id="likeBtn" > ❤️ Like </button> <button class="action-btn" id="downloadBtn" > ⬇ Download </button> <button class="action-btn" id="shareBtn" > 🔗 Share </button> </div> <div class="description-box"> <h3>Description</h3> <div class="description" id="description" > No description. </div> </div> <section class="comments-section"> <h2> Comments </h2> <div id="loginComment" class="login-comment" style="display:none;" > Please <a href="/login.html"> login </a> to write a comment. </div> <form id="commentForm" class="comment-form" style="display:none;" > <input type="text" id="commentInput" placeholder="Write a comment..." maxlength="1000" required > <button type="submit"> Comment </button> </form> <div id="commentsList"> Loading comments... </div> </section> </section> </div> </main> <script> const params = new URLSearchParams( window.location.search ); const videoId = params.get("id"); const token = localStorage.getItem("videohub_token"); const loading = document.getElementById("loading"); const errorBox = document.getElementById("errorBox"); const errorText = document.getElementById("errorText"); const videoContent = document.getElementById("videoContent"); const videoPlayer = document.getElementById("videoPlayer"); const videoTitle = document.getElementById("videoTitle"); const description = document.getElementById("description"); const views = document.getElementById("views"); const likes = document.getElementById("likes"); const downloads = document.getElementById("downloads"); const date = document.getElementById("date"); const likeBtn = document.getElementById("likeBtn"); const downloadBtn = document.getElementById("downloadBtn"); const shareBtn = document.getElementById("shareBtn"); const commentsList = document.getElementById("commentsList"); const commentForm = document.getElementById("commentForm"); const loginComment = document.getElementById("loginComment"); const commentInput = document.getElementById("commentInput"); const loginLink = document.getElementById("loginLink"); let currentVideo = null; let liked = false; let viewSent = false; function escapeHtml(value) { const div = document.createElement("div"); div.textContent = value ?? ""; return div.innerHTML; } function formatDate(value) { if (!value) { return "—"; } try { return new Date(value) .toLocaleDateString(); } catch { return value; } } function showError(text) { loading.style.display = "none"; videoContent.style.display = "none"; errorBox.style.display = "block"; errorText.textContent = text || "Unable to load video."; } function updateLoginUI() { if (token) { commentForm.style.display = "flex"; loginComment.style.display = "none"; loginLink.textContent = "Account"; } else { commentForm.style.display = "none"; loginComment.style.display = "block"; } } async function loadVideo() { if (!videoId) { showError( "No video ID was provided." ); return; } try { const response = await fetch( "/api/videos/" + encodeURIComponent(videoId) ); const data = await response.json(); if (!response.ok) { throw new Error( data.message || data.error || "Video not found." ); } currentVideo = data.video || data; videoTitle.textContent = currentVideo.title || "Untitled Video"; description.textContent = currentVideo.description || "No description available."; views.textContent = "👁 " + Number( currentVideo.views || 0 ).toLocaleString() + " views"; likes.textContent = "❤️ " + Number( currentVideo.likes || 0 ).toLocaleString() + " likes"; downloads.textContent = "⬇ " + Number( currentVideo.downloads || 0 ).toLocaleString() + " downloads"; date.textContent = "📅 " + formatDate( currentVideo.created_at ); videoPlayer.src = "/api/videos/" + encodeURIComponent(videoId) + "/stream"; loading.style.display = "none"; videoContent.style.display = "block"; updateLoginUI(); loadComments(); } catch (error) { console.error(error); showError( error.message || "Unable to load video." ); } } async function sendView() { if ( viewSent || !videoId ) { return; } viewSent = true; try { const response = await fetch( "/api/videos/" + encodeURIComponent(videoId) + "/view", { method: "POST" } ); if (response.ok) { const data = await response.json(); const count = data.views ?? ( Number( currentVideo?.views || 0 ) + 1 ); views.textContent = "👁 " + Number(count) .toLocaleString() + " views"; } } catch (error) { console.error( "View error:", error ); } } videoPlayer.addEventListener( "play", sendView, { once: true } ); async function toggleLike() { if (!token) { window.location.href = "/login.html"; return; } try { likeBtn.disabled = true; const response = await fetch( "/api/videos/" + encodeURIComponent(videoId) + "/like", { method: "POST", headers: { "Authorization": "Bearer " + token } } ); const data = await response.json(); if ( response.status === 401 || response.status === 403 ) { localStorage.removeItem( "videohub_token" ); window.location.href = "/login.html"; return; } if (!response.ok) { throw new Error( data.message || data.error || "Like request failed." ); } liked = data.liked ?? !liked; likeBtn.classList.toggle( "liked", liked ); const likeCount = data.likes ?? ( Number( currentVideo.likes || 0 ) + (liked ? 1 : -1) ); currentVideo.likes = Math.max( 0, Number(likeCount) ); likes.textContent = "❤️ " + currentVideo.likes .toLocaleString() + " likes"; } catch (error) { console.error(error); alert( error.message || "Unable to like video." ); } finally { likeBtn.disabled = false; } } likeBtn.addEventListener( "click", toggleLike ); async function downloadVideo() { try { downloadBtn.disabled = true; downloadBtn.textContent = "Preparing..."; const url = "/api/videos/" + encodeURIComponent(videoId) + "/download"; if (token) { const response = await fetch( url, { headers: { "Authorization": "Bearer " + token } } ); if (!response.ok) { const data = await response .json() .catch( () => ({}) ); throw new Error( data.message || data.error || "Download failed." ); } const contentType = response.headers.get( "content-type" ) || ""; if ( contentType.includes( "application/json" ) ) { const data = await response.json(); if (data.downloadUrl) { window.location.href = data.downloadUrl; } else { throw new Error( "Download URL was not returned." ); } } else { const blob = await response.blob(); const blobUrl = URL.createObjectURL( blob ); const a = document.createElement( "a" ); a.href = blobUrl; a.download = currentVideo?.filename || "videohub-video"; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL( blobUrl ); } } else { window.location.href = url; } } catch (error) { console.error(error); alert( error.message || "Unable to download video." ); } finally { downloadBtn.disabled = false; downloadBtn.textContent = "⬇ Download"; } } downloadBtn.addEventListener( "click", downloadVideo ); shareBtn.addEventListener( "click", async function () { const shareData = { title: currentVideo?.title || "VideoHub Video", text: currentVideo?.description || "Watch this video on VideoHub.", url: window.location.href }; try { if ( navigator.share ) { await navigator.share( shareData ); } else { await navigator.clipboard .writeText( window.location.href ); alert( "Video link copied!" ); } } catch (error) { console.log( "Share cancelled." ); } } ); async function loadComments() { commentsList.textContent = "Loading comments..."; try { const response = await fetch( "/api/videos/" + encodeURIComponent(videoId) + "/comments" ); const data = await response.json(); if (!response.ok) { throw new Error( data.message || data.error || "Could not load comments." ); } const comments = Array.isArray(data) ? data : ( data.comments || [] ); if (!comments.length) { commentsList.innerHTML = '<div class="login-comment">' + "No comments yet. Be the first!" + "</div>"; return; } commentsList.innerHTML = comments .map(function (comment) { const author = comment.user_name || comment.name || comment.email || "User"; return ` <div class="comment"> <div class="comment-author"> ${escapeHtml(author)} </div> <div class="comment-date"> ${formatDate(comment.created_at)} </div> <div class="comment-text"> ${escapeHtml(comment.text)} </div> </div> `; }) .join(""); } catch (error) { console.error(error); commentsList.innerHTML = '<div class="login-comment">' + "Unable to load comments." + "</div>"; } } commentForm.addEventListener( "submit", async function (event) { event.preventDefault(); const text = commentInput.value.trim(); if (!text) { return; } try { const button = commentForm.querySelector( "button" ); button.disabled = true; button.textContent = "Posting..."; const response = await fetch( "/api/videos/" + encodeURIComponent(videoId) + "/comments", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }, body: JSON.stringify({ text: text }) } ); const data = await response.json(); if ( response.status === 401 || response.status === 403 ) { localStorage.removeItem( "videohub_token" ); window.location.href = "/login.html"; return; } if (!response.ok) { throw new Error( data.message || data.error || "Comment failed." ); } commentInput.value = ""; await loadComments(); } catch (error) { console.error(error); alert( error.message || "Unable to post comment." ); } finally { const button = commentForm.querySelector( "button" ); button.disabled = false; button.textContent = "Comment"; } } ); loadVideo(); </script> </body> </html>
