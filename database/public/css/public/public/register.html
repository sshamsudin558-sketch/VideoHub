<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Create Account - VideoHub</title> <link rel="stylesheet" href="/css/style.css"> <style> .auth-page { min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; } .auth-card { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 35px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); } .auth-icon { width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; background: linear-gradient(135deg, #6c5ce7, #00cec9); color: white; } .auth-title { text-align: center; font-size: 30px; margin-bottom: 8px; } .auth-subtitle { text-align: center; color: var(--muted); margin-bottom: 30px; } .form-group { margin-bottom: 18px; } .form-group label { display: block; margin-bottom: 8px; font-weight: 600; } .form-group input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none; box-sizing: border-box; } .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108, 92, 231, .15); } .password-wrap { position: relative; } .password-wrap input { padding-right: 50px; } .show-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; } .register-btn { width: 100%; border: 0; border-radius: 12px; padding: 15px; margin-top: 8px; background: linear-gradient(135deg, #6c5ce7, #00cec9); color: white; font-size: 16px; font-weight: 700; cursor: pointer; transition: .2s; } .register-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(108, 92, 231, .25); } .register-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; } .message { display: none; padding: 12px 14px; border-radius: 10px; margin-bottom: 18px; font-size: 14px; } .message.error { display: block; background: rgba(255, 71, 87, .12); color: #ff6b81; border: 1px solid rgba(255, 71, 87, .25); } .message.success { display: block; background: rgba(0, 206, 201, .12); color: #55efc4; border: 1px solid rgba(0, 206, 201, .25); } .auth-footer { text-align: center; margin-top: 25px; color: var(--muted); font-size: 14px; } .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 700; } .terms { margin-top: 15px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; } @media (max-width: 520px) { .auth-page { padding: 25px 15px; } .auth-card { padding: 25px 20px; border-radius: 18px; } .auth-title { font-size: 25px; } } </style> </head> <body> <header class="site-header"> <div class="container nav-container"> <a href="/" class="logo"> <span class="logo-icon">▶</span> <span>VideoHub</span> </a> <nav class="nav-links"> <a href="/">Home</a> <a href="/login.html">Login</a> </nav> </div> </header> <main class="auth-page"> <div class="auth-card"> <div class="auth-icon"> 👤 </div> <h1 class="auth-title">Create Account</h1> <p class="auth-subtitle"> Join VideoHub and start sharing your videos </p> <div id="message" class="message"></div> <form id="registerForm"> <div class="form-group"> <label for="name">Full Name</label> <input type="text" id="name" name="name" placeholder="Enter your full name" maxlength="120" required > </div> <div class="form-group"> <label for="email">Email Address</label> <input type="email" id="email" name="email" placeholder="you@example.com" maxlength="255" required > </div> <div class="form-group"> <label for="password">Password</label> <div class="password-wrap"> <input type="password" id="password" name="password" placeholder="Create a strong password" minlength="6" required > <button type="button" class="show-password" id="togglePassword" aria-label="Show password" > 👁 </button> </div> </div> <div class="form-group"> <label for="confirmPassword">Confirm Password</label> <div class="password-wrap"> <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" minlength="6" required > <button type="button" class="show-password" id="toggleConfirmPassword" aria-label="Show password" > 👁 </button> </div> </div> <button type="submit" class="register-btn" id="registerBtn" > Create Account </button> </form> <div class="terms"> By creating an account, you agree to use VideoHub responsibly. </div> <div class="auth-footer"> Already have an account? <a href="/login.html">Login</a> </div> </div> </main> <script> const form = document.getElementById("registerForm"); const message = document.getElementById("message"); const registerBtn = document.getElementById("registerBtn"); const password = document.getElementById("password"); const confirmPassword = document.getElementById("confirmPassword"); const togglePassword = document.getElementById("togglePassword"); const toggleConfirmPassword = document.getElementById("toggleConfirmPassword"); function showMessage(text, type) { message.textContent = text; message.className = "message " + type; } function toggleInput(input, button) { if (input.type === "password") { input.type = "text"; button.textContent = "🙈"; } else { input.type = "password"; button.textContent = "👁"; } } togglePassword.addEventListener("click", function () { toggleInput(password, togglePassword); }); toggleConfirmPassword.addEventListener("click", function () { toggleInput(confirmPassword, toggleConfirmPassword); }); form.addEventListener("submit", async function (event) { event.preventDefault(); const name = document.getElementById("name").value.trim(); const email = document.getElementById("email").value.trim(); const passwordValue = password.value; const confirmPasswordValue = confirmPassword.value; if (!name || !email || !passwordValue) { showMessage("Please fill in all required fields.", "error"); return; } if (passwordValue.length < 6) { showMessage( "Password must be at least 6 characters.", "error" ); return; } if (passwordValue !== confirmPasswordValue) { showMessage( "Passwords do not match.", "error" ); return; } registerBtn.disabled = true; registerBtn.textContent = "Creating Account..."; message.className = "message"; message.textContent = ""; try { const response = await fetch("/api/auth/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: name, email: email, password: passwordValue }) }); const data = await response.json(); if (!response.ok) { throw new Error( data.message || data.error || "Registration failed." ); } showMessage( "Account created successfully! Redirecting to login...", "success" ); form.reset(); setTimeout(function () { window.location.href = "/login.html"; }, 1200); } catch (error) { console.error(error); showMessage( error.message || "Something went wrong. Please try again.", "error" ); registerBtn.disabled = false; registerBtn.textContent = "Create Account"; } }); </script> </body> </html>
