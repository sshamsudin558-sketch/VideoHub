<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modern Video Hub</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">▶</span><span>VideoHub</span></div>
  <button class="uploadBtn" onclick="openUpload()">＋ Upload Video</button>
</header>

<main>
  <section class="hero">
    <div>
      <p class="eyebrow">YOUR PERSONAL VIDEO PLATFORM</p>
      <h1>Store. Watch.<br><span>Share your videos.</span></h1>
      <p class="sub">A clean modern video hub for uploading and streaming your own video library.</p>
      <button class="primary" onclick="openUpload()">Upload a video</button>
    </div>
    <div class="heroCard"><div class="play">▶</div><p>HD VIDEO LIBRARY</p></div>
  </section>

  <section class="library">
    <div class="sectionHead">
      <div><h2>Your Library</h2><p id="count">Loading videos...</p></div>
      <button class="refresh" onclick="loadVideos()">↻ Refresh</button>
    </div>
    <div id="grid" class="grid"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="dialog">
    <button class="close" onclick="closeUpload()">×</button>
    <h2>Upload video</h2>
    <p>Choose an MP4, WebM, OGG, MOV or M4V video.</p>
    <form id="uploadForm">
      <label class="drop">
        <input id="video" name="video" type="file" accept="video/*" required>
        <strong>Choose video</strong>
        <span id="fileName">No file selected</span>
      </label>
      <button class="primary full" type="submit">Start upload</button>
    </form>
    <div id="status"></div>
  </div>
</div>

<script>
const grid = document.getElementById("grid");
const count = document.getElementById("count");
const modal = document.getElementById("modal");
const input = document.getElementById("video");
const fileName = document.getElementById("fileName");
const statusBox = document.getElementById("status");

function openUpload(){ modal.classList.remove("hidden"); }
function closeUpload(){ modal.classList.add("hidden"); statusBox.textContent=""; }

input.addEventListener("change", () => {
  fileName.textContent = input.files[0]?.name || "No file selected";
});

function formatSize(bytes){
  const units=["B","KB","MB","GB","TB"];
  let i=0,n=bytes;
  while(n>=1024 && i<units.length-1){n/=1024;i++;}
  return `${n.toFixed(i?1:0)} ${units[i]}`;
}

async function loadVideos(){
  const res = await fetch("/api/videos");
  const videos = await res.json();
  count.textContent = `${videos.length} video${videos.length===1?"":"s"} in your library`;
  if(!videos.length){
    grid.innerHTML = `<div class="empty"><div>▶</div><h3>Your library is empty</h3><p>Upload your first video to get started.</p></div>`;
    return;
  }
  grid.innerHTML = videos.map(v => `
    <article class="card">
      <video controls preload="metadata" src="${v.url}"></video>
      <div class="meta">
        <h3 title="${v.name}">${v.name}</h3>
        <p>${formatSize(v.size)}</p>
      </div>
    </article>`).join("");
}

document.getElementById("uploadForm").addEventListener("submit", async e => {
  e.preventDefault();
  if(!input.files[0]) return;
  statusBox.textContent = "Uploading... Please keep this page open.";
  const data = new FormData(e.target);
  try {
    const res = await fetch("/api/upload", {method:"POST", body:data});
    const json = await res.json();
    if(!res.ok) throw new Error(json.error || "Upload failed");
    statusBox.textContent = "Upload complete.";
    e.target.reset();
    fileName.textContent = "No file selected";
    await loadVideos();
    setTimeout(closeUpload, 700);
  } catch(err) {
    statusBox.textContent = err.message;
  }
});

loadVideos();
</script>
</body>
  </html>
